# configs/paths.yaml
# All paths are relative to the project root directory.

project_root: "."

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  external_dir: "data/external"

  # Raw CSV filenames used as project inputs
  train_transaction: "data/raw/train_transaction.csv"
  train_identity: "data/raw/train_identity.csv"

  # Interim parquet outputs
  merged_train: "data/interim/merged_train.parquet"
  cleaned_train: "data/interim/cleaned_train.parquet"
  cleaned_holdout_replay: "data/interim/cleaned_holdout_replay.parquet"
  feature_ready_train: "data/interim/feature_ready_train.parquet"

  # Processed splits
  X_train: "data/processed/X_train.parquet"
  X_valid: "data/processed/X_valid.parquet"
  X_test: "data/processed/X_test.parquet"
  y_train: "data/processed/y_train.parquet"
  y_valid: "data/processed/y_valid.parquet"
  y_test: "data/processed/y_test.parquet"

models:
  baseline_dir: "artifacts/models/baseline"
  experiments_dir: "artifacts/models/experiments"
  final_dir: "artifacts/models/final"

artifacts:
  encoders_dir: "artifacts/models/artifacts/encoders"
  imputers_dir: "artifacts/models/artifacts/imputers"
  feature_lists_dir: "artifacts/models/artifacts/feature_lists"
  thresholds_dir: "artifacts/models/artifacts/thresholds"

reports:
  figures_dir: "reports/figures"
  metrics_dir: "reports/metrics"
  tables_dir: "reports/tables"
  final_report_dir: "reports/final_report"

logs:
  log_dir: "logs"
  log_file: "logs/pipeline.log"
