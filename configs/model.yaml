# configs/model.yaml
# Model training and tuning configuration.

target_column: "isFraud"

# Columns to exclude from feature matrix
drop_before_training:
  - "TransactionID"
  - "isFraud"
  - "TransactionDT"

# Optional train-only resampling for class imbalance.
# Applied after preprocessing and before model fit.
smote:
  enabled: false
  sampling_strategy: "auto"
  k_neighbors: 5
  random_state: 42

# Optional anomaly pre-filter trained on legit transactions only.
isolation_forest:
  enabled: false
  contamination: 0.035
  n_estimators: 200
  max_samples: "auto"
  random_state: 42
  n_jobs: -1
  review_on_anomaly: true

# Optional Optuna tuning on the chronological training split.
tuning:
  enabled: false
  study_name: "xgboost_tuning"
  # Null uses artifacts/models/experiments/<study_name>.db
  storage: null
  load_if_exists: true
  seed: 42
  sampler: "tpe"
  pruner: "median"
  n_startup_trials: 10
  n_warmup_steps: 1
  n_trials: 25
  n_splits: 4
  timeout_seconds: null
  # Supported: average_precision / pr_auc / aucpr / roc_auc
  metric: "average_precision"

# Optional MLflow tracking for offline training runs.
mlflow:
  enabled: true
  tracking_uri: null
  experiment_name: "ieee-fraud-detection"
  run_name: "xgboost_smote_onnx"
  register_model_name: null

# SHAP explainability options for offline reports and API explanations.
explainability:
  enabled: true
  top_n: 10
  save_global_importance: true

# ── XGBoost baseline ──────────────────────────────────────
xgboost:
  booster: "gbtree"
  objective: "binary:logistic"
  eval_metric: "aucpr"
  n_estimators: 1000
  max_depth: 7
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 50
  gamma: 1.0
  reg_alpha: 0.1
  reg_lambda: 1.0
  # scale_pos_weight is computed at runtime as n_neg / n_pos
  scale_pos_weight: null
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
  tree_method: "hist"
  verbosity: 1

# ── LightGBM (optional second model) ─────────────────────
lightgbm:
  objective: "binary"
  metric: "average_precision"
  n_estimators: 1000
  max_depth: 7
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 50
  reg_alpha: 0.1
  reg_lambda: 1.0
  is_unbalance: true
  early_stopping_rounds: 50
  random_state: 42
  n_jobs: -1
  verbose: -1

# ── Thresholding ──────────────────────────────────────────
thresholding:
  # Search range for optimal threshold
  min_threshold: 0.05
  max_threshold: 0.95
  step: 0.01
  # Primary metric to maximise when choosing a threshold
  optimise_metric: "f1"
  # Triage threshold below the block threshold.
  review_threshold: 0.35

# ── Evaluation ────────────────────────────────────────────
evaluation:
  metrics:
    - "roc_auc"
    - "pr_auc"
    - "precision"
    - "recall"
    - "f1"
  save_confusion_matrix: true
  save_pr_curve: true
  save_roc_curve: true
  save_feature_importance: true
